# Configuration for `cargo audit`, which CI runs against this Cargo.lock.
#
# Every ignore here names the advisory, why it does not reach the `kgf` binary,
# and what removes it. Drop the entry once the fix lands, so an advisory that
# later becomes reachable fails the audit again.

[advisories]
ignore = [
    # quick-xml 0.37.5: quadratic duplicate-attribute check and unbounded
    # namespace allocation, both in the XML *reader*. It arrives through
    # oxrdfio's RDF/XML parser, pulled in by hdtc and by this workspace's own
    # oxrdfio dependency. `kgf` never parses RDF/XML: outside tests it only
    # parses N-Triples, and it reaches RDF parsing in hdtc by running the `hdtc`
    # binary, never by calling hdtc's parser in process. The exposure is `hdtc`
    # reading RDF/XML input the operator supplies at build time. The fix is
    # quick-xml 0.41 or newer in hdtc, including its vendored oxrdfxml, and
    # then an hdtc release this lockfile moves to.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]
