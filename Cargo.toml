[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/frink-okn/kgf-rs"

[workspace.dependencies]
kgf-store = { path = "crates/kgf-store" }
kgf-server = { path = "crates/kgf-server" }

# hdtc owns every byte format a bundle contains; `hdtc::format` is the curated
# surface we depend on (KGF doc 20 §20.4). A path dependency on the sibling
# checkout while both move together; pinned to a git rev at release.
hdtc = { path = "../hdtc" }

anyhow = "1"
thiserror = "2"
memmap2 = "0.9"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
oxiri = "0.2"

# The HTTP stack (unit 13). axum is doc 20 §20.4's suggestion and survives the
# QUERY support: hyper parses the extension method and axum routes it through
# the custom-method fallback used by the body-carrying operations.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "original-uri"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "macros"] }
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }
# hyperium's typed headers: ETag, If-None-Match's RFC 9110 §13.1.2 comparison,
# and Cache-Control. Already in axum's tree through axum-extra.
headers = "0.4"
axum-extra = { version = "0.10", default-features = false, features = ["typed-header"] }
# Already in axum's tree; named directly because this crate uses them for the
# two things doc 03 leaves to RFC 3986 and RFC 9110 — percent-encoding, and
# parsing the media ranges in an `Accept` header.
# `mediatype` and not `mime`: `mime` rejects the optional whitespace RFC 9110
# §5.6.3 allows around a parameter's `;`, which silently drops a legal media
# range from an `Accept` header.
mediatype = "0.23"
# Compile-time HTML. Escapes every interpolation and needs `PreEscaped` to opt
# out, so no page can lose an escape by being written with `format!`.
maud = "0.27"
# Already under hyper. Named directly so a response body can be handed on by
# refcount rather than copied out of the buffer it is already in.
bytes = "1"
percent-encoding = "2"
# RFC 3339 in, an orderable instant out. `std` only: nothing here needs a time
# zone database, because the only thing kgf does with a date is sort by it.
jiff = { version = "0.2", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
lto = true
codegen-units = 1
debug = 1          # keep frames: every latency number in doc 07 §7.2 comes from a profile
