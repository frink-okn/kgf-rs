[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/frink-okn/kgf-rs"

[workspace.dependencies]
kgf-store = { path = "crates/kgf-store" }
kgf-server = { path = "crates/kgf-server" }

# hdtc owns every byte format a bundle contains; `hdtc::format` is the curated
# surface we depend on (KGF doc 20 §20.4). A path dependency on the sibling
# checkout while both move together; pinned to a git rev at release.
hdtc = { path = "../hdtc" }

anyhow = "1"
thiserror = "2"
memmap2 = "0.9"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
debug = 1          # keep frames: every latency number in doc 07 §7.2 comes from a profile
