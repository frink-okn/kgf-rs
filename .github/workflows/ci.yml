# The golden-bundle tests are differential: hdtc builds the fixtures and
# `hdtc search` answers them independently. That only means
# anything if the hdtc under test is the current one, so CI checks out the
# sibling repo and builds it here rather than trusting a developer's stale
# `../hdtc/target`. The layout matches what `Cargo.toml`'s `path = "../hdtc"`
# and `testing::hdtc_binary` expect: the two checkouts side by side.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Warnings are denied by the clippy step's `-D warnings`, which covers every
# target of this workspace and nothing outside it. There is deliberately no
# `RUSTFLAGS: -D warnings`: hdtc and its vendored crates are path dependencies,
# so RUSTFLAGS would deny their warnings too, compiled against this repo's
# Cargo.lock rather than hdtc's. A dependency deprecating an API hdtc calls then
# fails CI here with no change on either side, as tempfile 3.27 deprecating
# `TempPath::from_path` did. hdtc's own CI holds hdtc to its warnings.
env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out kgf-rs
        uses: actions/checkout@v4
        with:
          path: kgf-rs

      - name: Check out hdtc
        uses: actions/checkout@v4
        with:
          repository: frink-okn/hdtc
          ref: v1.3.1
          path: hdtc

      # Pinned, not `@stable`. A floating toolchain means CI can go red with no
      # code change at all — which is what happened when 1.98 added
      # `clippy::chunks_exact_to_as_chunks` and `-D warnings` turned it into a
      # build failure. The differential tests already pin hdtc to a tag; a
      # floating compiler was the odd one out. Bumping this is a deliberate
      # commit, and the same commit fixes whatever the new lints find.
      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            kgf-rs
            hdtc

      # Release, because every fixture in the suite shells out to this binary
      # to build a bundle; a debug hdtc dominates the run time.
      - name: Build the hdtc binary
        working-directory: hdtc
        run: cargo build --release --locked --bin hdtc

      - name: cargo fmt
        working-directory: kgf-rs
        run: cargo fmt --check

      # `--locked`, as the Dockerfile builds. `Cargo.lock` records the hdtc
      # version kgf-rs was resolved against, so a `ref` above that disagrees
      # with it fails here. Without the flag cargo would quietly re-resolve
      # against the checked-out tag, CI would test an hdtc the image never
      # ships, and the mismatch would surface only when a release's image
      # build refused it.
      - name: cargo clippy
        working-directory: kgf-rs
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        working-directory: kgf-rs
        env:
          KGF_HDTC: ${{ github.workspace }}/hdtc/target/release/hdtc
        run: cargo test --locked

      - name: Install Node.js for stock Comunica
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kgf-rs/interop/comunica/package-lock.json

      - name: Install pinned Comunica
        working-directory: kgf-rs
        run: npm ci --prefix interop/comunica

      - name: Stock Comunica conformance
        working-directory: kgf-rs
        env:
          KGF_HDTC: ${{ github.workspace }}/hdtc/target/release/hdtc
        run: cargo test --locked -p kgf --test serve stock_comunica_5_3_queries_the_fragment_endpoint -- --ignored --nocapture
