[package]
name = "kgf-server"
description = "The KGF HTTP API over kgf-store (KGF doc 03)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kgf-store.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
base64.workspace = true
sha2.workspace = true

[dev-dependencies]
# The hdtc-built golden bundles, so cursor resumption is checked against real
# enumerations rather than a hand-written stand-in (doc 20 §20.9).
kgf-store = { workspace = true, features = ["testing"] }
