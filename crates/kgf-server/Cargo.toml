[package]
name = "kgf-server"
description = "The KGF HTTP API over kgf-store (KGF doc 03)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kgf-store.workspace = true
# `hdtc::format::{encode_literal, parse_literal}`: how a term is spelled once it
# is in the dictionary. Resolving a request term to an id happens here, at the
# boundary doc 20 §20.5 names, so this is where that spelling has to be right —
# and getting it wrong loses rows silently rather than failing.
hdtc.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
axum.workspace = true
tokio.workspace = true
tower-http.workspace = true
headers.workspace = true
axum-extra.workspace = true
mediatype.workspace = true
maud.workspace = true
bytes.workspace = true
jiff.workspace = true
percent-encoding.workspace = true
oxrdf.workspace = true
oxrdfio.workspace = true
spargebra.workspace = true

[dev-dependencies]
# An independent implementation of RFC 9110 §12.5.1, as the oracle for
# `tests/negotiation.rs`. Not a dependency of the server: its tie-break and its
# parameter handling differ from ours deliberately, and that file says how.
headers-accept = "0.3"
# `headers-accept` still builds on `mediatype` 0.21, and its `negotiate` takes
# that version's types. Aliased rather than pinning the whole workspace back,
# because the oracle and this crate exchange only strings: letting a test-only
# crate choose a shipped dependency's version is the tail wagging the dog.
mediatype_021 = { package = "mediatype", version = "0.21" }
# The hdtc-built golden bundles, so cursor resumption is checked against real
# enumerations rather than a hand-written stand-in (doc 20 §20.9).
kgf-store = { workspace = true, features = ["testing"] }
