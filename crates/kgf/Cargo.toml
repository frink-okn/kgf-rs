[package]
name = "kgf"
description = "The KGF server and build tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "kgf"
path = "src/main.rs"

[lib]
name = "kgf"
path = "src/lib.rs"

[dependencies]
kgf-server.workspace = true
kgf-store.workspace = true
# `kgf manifest` is the only place in KGF that reads whole artifacts, so it is
# where a text index's binding to its HDT is checked. `kgf-store` deliberately
# never hashes a file, and the check must not be a second reading
# of how that binding is computed.
hdtc.workspace = true
anyhow.workspace = true
tracing.workspace = true
clap.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
sha2.workspace = true
serde_json.workspace = true
serde.workspace = true
serde_norway.workspace = true
oxrdf.workspace = true
oxiri.workspace = true
oxrdfio.workspace = true
tempfile.workspace = true

[dev-dependencies]
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["sync"] }
tempfile.workspace = true
# `testing::hdtc_binary`, so the integration test does not carry its own copy
# of where the sibling checkout lives.
kgf-store = { workspace = true, features = ["testing"] }
