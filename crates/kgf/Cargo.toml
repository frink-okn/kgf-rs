[package]
name = "kgf"
description = "The KGF server and build tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "kgf"
path = "src/main.rs"

[lib]
name = "kgf"
path = "src/lib.rs"

[dependencies]
kgf-server.workspace = true
kgf-store.workspace = true
anyhow.workspace = true
tracing.workspace = true
clap.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
sha2.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["sync"] }
tempfile = "3"
# `testing::hdtc_binary`, so the integration test does not carry its own copy
# of where the sibling checkout lives.
kgf-store = { workspace = true, features = ["testing"] }
