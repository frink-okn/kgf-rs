[package]
name = "kgf-store"
description = "Memory-mapped read layer over KGF bundles (KGF doc 20)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
hdtc.workspace = true
anyhow.workspace = true
thiserror.workspace = true
memmap2.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = { version = "3", optional = true }

[features]
# Exposes `kgf_store::testing`: the hdtc-built golden bundles (doc 20 §20.9).
# Dependents enable it in `dev-dependencies` only — it is test support, not a
# runtime surface.
testing = ["dep:tempfile"]

[dev-dependencies]
tempfile = "3"
